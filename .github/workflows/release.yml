name: Release
# Push a tag vX.Y.Z (just release X.Y.Z): tests, build, zip, checksum, GitHub Release with the changelog.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history + tags for the changelog
      - name: Gates (tests + 100% coverage)
        run: tools/swift-coverage.sh
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent Kanba.app "Kanba-$V.zip"
          shasum -a 256 "Kanba-$V.zip" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Changelog = commits since the previous tag (generated notes alone only list merged PRs).
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log ${PREV:+$PREV..}"$GITHUB_REF_NAME" --no-merges --format='- %s' > NOTES.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file NOTES.md --generate-notes --title "Kanba ${GITHUB_REF_NAME#v}" "Kanba-${GITHUB_REF_NAME#v}.zip" SHA256SUMS
