name: Release
# A release happens only when the VERSION file changes on main (just release X.Y.Z): tests, build, zip, checksum, tag vX.Y.Z, GitHub Release with the changelog.
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history + tags for the changelog
      - name: Is this a new version?
        id: v
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null && echo "v$V already released: nothing to do" && echo "skip=true" >> "$GITHUB_OUTPUT" || true
      - name: Gates (tests + 100% coverage)
        if: steps.v.outputs.skip != 'true'
        run: apps/macos/tools/swift-coverage.sh
      - name: Build
        if: steps.v.outputs.skip != 'true'
        run: apps/macos/build.sh
      - name: Package
        if: steps.v.outputs.skip != 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          ditto -c -k --keepParent apps/macos/Kanba.app "Kanba-$V.zip"
          shasum -a 256 "Kanba-$V.zip" > SHA256SUMS
      - name: Tag and publish
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          # Changelog = commits since the previous tag (generated notes alone only list merged PRs).
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git log ${PREV:+$PREV..}HEAD --no-merges --format='- %s' > NOTES.md
          gh release create "v$V" --target "$GITHUB_SHA" --notes-file NOTES.md --generate-notes --title "Kanba $V" "Kanba-$V.zip" SHA256SUMS
