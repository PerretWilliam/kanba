name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tests + 100% line coverage (logic layer)
        run: apps/macos/tools/swift-coverage.sh
      - name: Build the app
        run: apps/macos/build.sh
